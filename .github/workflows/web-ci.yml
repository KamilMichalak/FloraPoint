name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "FloraPointWeb/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "FloraPointWeb/**"
      - ".github/workflows/web-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FloraPointWeb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FloraPointWeb/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
